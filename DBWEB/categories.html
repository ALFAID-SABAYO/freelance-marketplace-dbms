<!doctype html>
<html lang="en">
<head>
  <title>Categories Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <style>
    body { padding: 20px; }
    table thead th {
      text-transform: uppercase;
      background-color: #13123f;
      color: white;
    }
    .card.bg-light {
      background-color: #f9f9f9;
      color: #000;
    }
    .form-control::placeholder {
      color: #aaa;
    }
  </style>
    <!-- Your external CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
<div class="container">

  <!-- Top Buttons -->
  <div class="mb-4 d-flex justify-content-between align-items-center">
    <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
    <div>
      <button class="btn btn-success me-2" id="insertCategoryBtn">➕ Insert</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-bordered mb-0" id="categoriesTable">
      <thead class="table-secondary">
        <tr >
          <th>CATEGORY ID</th>
          <th>NAME</th>
          <th>DESCRIPTION</th>
          <th>EDIT</th>
        </tr>
      </thead>
      <tbody>
        <!-- JS will populate -->
      </tbody>
    </table>
  </div>

  <!-- Form Section -->
  <div id="formSection" class="card p-4 bg-light d-none mt-4">
     <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>
    <h5 id="formTitle">Insert Category</h5>
    <form id="categoryForm" novalidate>
      <div class="row">
        <div class="col-md-4 mb-3">
          <input type="text" id="category_id" class="form-control" placeholder="Category ID" required />
        </div>
        <div class="col-md-4 mb-3">
          <input type="text" id="name" class="form-control" placeholder="Category Name" required />
        </div>
        <div class="col-md-4 mb-3">
          <input type="text" id="description" class="form-control" placeholder="Description" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary">💾 Submit</button>
    </form>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="JS/categories.js"></script>
</body>
</html>
