<!doctype html>
<html lang="en">
<head>
    <title>Categories Table</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    />
    <style>
        body { padding: 20px; }
        table thead th { text-transform: uppercase; }
    </style>
     <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
    <div class="container">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
        <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
        <button class="btn btn-warning" onclick="showForm('upgrade')">🛠️ Upgrade</button>
      </div>
    </div>
     <div class="table-responsive">
             <table class="table table-bordered mb-0" id="categoriesTable" >
                <thead>
                    <tr>
                        <th>CATEGORY ID</th>
                        <th>NAME</th>
                        <th>DESCRIPTION</th>
               </tr>
        </thead>
        <tbody>
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
         <!-- Form Section -->
   <div id="formSection" class="card p-4 bg-light">
      <h5 id="formTitle">Insert Category</h5>
      <form id="category" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="category_id" class="form-control" placeholder="Category ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="category_name" class="form-control" placeholder="Category Name" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="description" class="form-control" placeholder="Description" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">💾 Submit</button>
      </form>
    </div>
 
    <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
   
    <script src="JS/categories.js"></script>
</body>
</html>
