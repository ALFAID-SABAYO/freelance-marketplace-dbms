<!doctype html>
<html lang="en">
<head>
  <title>Categories Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js -->
</head>
<body>
  <div class="container my-4">
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
        <button class="btn btn-success me-2" onclick="showForm()">➕ Insert</button>
        <button class="btn btn-info" onclick="showChart()">📊 Show Chart</button>
      </div>
    </div>

    <h2 class="mb-3">Category</h2>

    <div class="table-responsive shadow-sm rounded" id="tableSection">
      <table class="table table-bordered mb-0" id="categoriesTable">
        <thead class="table-secondary">
          <tr class="text-center">
            <th>CATEGORY ID</th>
            <th>NAME</th>
            <th>DESCRIPTION</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Insert Form -->
    <div id="formSection" class="card p-4 bg-light d-none mt-4 position-relative">
      <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>
      <h5 id="formTitle">Insert Category</h5>
      <form id="categoryForm" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" id="name" class="form-control" placeholder="Category Name" required />
            <div class="invalid-feedback">Please enter category name.</div>
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" id="description" class="form-control" placeholder="Description" required />
            <div class="invalid-feedback">Please enter description.</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>

    <!-- Chart Section -->
    <div id="chartSection" class="card p-4 bg-white d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>Category Name Chart</h5>
        <button class="btn btn-light" onclick="hideChart()">✖</button>
      </div>
      <canvas id="categoryChart" height="300"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="JS/categories.js"></script>
</body>
</html>
