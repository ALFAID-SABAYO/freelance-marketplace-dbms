<!doctype html>
<html lang="en">
<head>
  <title>Contracts Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <!-- Your external CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
      <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
        
      </div>
    </div>
    <h2 class="mb-3">Contract</h2>
    <div class="table-responsive">
        <table class="table table-light table-bordered" id="contractsTable">
            <thead>
                <tr>
                    <th>CONTRACT ID</th>
                    <th>PROJECT ID</th>
                    <th>FREELANCER ID</th>
                    <th>START DATE</th>
                    <th>END DATE</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody>
               <!--Contracts rows here--> 
            </tbody>
        </table>
    </div>

     <div id="formSection" class="card p-4 bg-light  mt-4">
  <!-- Cancel Button -->
  <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>

  <h5 id="formTitle">Insert Contract</h5>
  <form id="userForm" novalidate>
    <div class="row">
  
      <div class="col-md-4 mb-3">
        <input type="text" id="project_id" class="form-control" placeholder="Project D" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="text" id="freelancer_id" class="form-control" placeholder="Freelancer ID" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="date" id="start_date" class="form-control" placeholder="Start Date" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="date" id="end_date" class="form-control" placeholder="End Date" />
      </div>
      <div class="col-md-4 mb-3">
        <select id="status" class="form-control" required>
          <option value="" disabled selected>Status</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
     </div>
     </div>
    <button type="submit" class="btn btn-primary">💾 Submit</button>
  </form>
</div>
  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
    <script src="JS/contracts.js"></script>
</body>
</html>
