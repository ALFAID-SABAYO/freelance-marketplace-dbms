<!doctype html>
<html lang="en">
<head>
    <title>Freelancer Skills Table</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    />
    <style>
        body { padding: 20px; }
        table thead th { text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Freelancer Skills</h2>
        <div class="table-responsive">
            <table class="table table-info table-bordered" id="freelancerSkillsTable">
                <thead>
                    <tr>
                        <th>USER ID</th>
                        <th>SKILL ID</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JS Scripts (Put your custom script at the END so DOM is ready) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"
    ></script>
    <script src="JS/freelancer_skills.js"></script>
</body>
</html>
