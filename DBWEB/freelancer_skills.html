<!doctype html>
<html lang="en">
<head>
  <title>Freelancer Skills Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container mt-4">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <button class="btn btn-success" onclick="showForm('insert')">➕ Insert</button>
    </div>

    <!-- Table Title -->
    <h2 class="mb-3">Freelancer Skills</h2>

    <!-- Table Display -->
    <div class="table-responsive">
      <table class="table table-info table-bordered" id="freelancerSkillsTable">
        <thead class="table-dark">
          <tr class="text-center">
            <th>Freelancer Skill ID</th>
            <th>User ID</th>
            <th>Skill ID</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data will be inserted here by JS -->
        </tbody>
      </table>
    </div>

    <!-- Insert/Update Form -->
    <div id="formSection" class="card p-4 bg-light d-none mt-4">
      <h5 id="formTitle">Insert Freelancer Skill</h5>
      <form id="freelancerSkillForm" novalidate>
        <!-- Hidden input for freelancer_skill_id (used for updates) -->
        <input type="hidden" id="freelancer_skill_id" />

        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="user_id" class="form-control" placeholder="User ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="skill_id" class="form-control" placeholder="Skill ID" required />
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">💾 Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS and Popper -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

  <!-- Your JS -->
  <script src="JS/freelancer_skills.js"></script>
</body>
</html>
