<!doctype html>
<html lang="en">
<head>
  <title>Messages Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container my-4">

    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
        <button class="btn btn-success me-2" onclick="showReviewForm()">➕ Insert</button>
      </div>
    </div>
    <h2 class="mb-3">Message</h2>
    <div class="table-responsive">
        <table class="table table-light table-bordered" id="messagesTable">
             <thead class="table-secondary">
                <tr>
                    <th>MESSAGE ID</th>
                    <th>SENDER ID</th>
                    <th>RECEIVER ID</th>
                    <th>CONTENT</th>
                    <th>SENT AT</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div id="formSection" class="card p-4 bg-light d-none mt-4 position-relative">
      
    <button type="button" id="cancelReviewFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>
     <h5 id="formTitle">Insert Payment</h5>
     <form id="userForm" novalidate>
    <div class="row">
  
      <div class="col-md-4 mb-3">
        <input type="text" id="sender_id" class="form-control" placeholder="Sender ID" required />
      </div>
       <div class="col-md-4 mb-3">
        <input type="text" id="receiver_id" class="form-control" placeholder="Receiver ID" required />
      </div>
       <div class="col-md-4 mb-3">
        <input type="text" id="content" class="form-control" placeholder="Content" required />
      </div>  
     </div>
    <button type="submit" class="btn btn-primary">💾 Submit</button>
  </form>
</div>

    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        crossorigin="anonymous"
    ></script>
    <script src="JS/messages.js"></script>
</body>
</html>
