<!doctype html>
<html lang="en">
<head>
  <title>Payments Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <!-- Your external CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container mt-4">
    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <button class="btn btn-success" onclick="showForm('insert')">➕ Insert</button>
    </div>

    <h2 class="mb-3">Payments</h2>

    <div class="table-responsive">
      <table class="table table-secondary table-bordered" id="paymentsTable">
        <thead>
          <tr>
            <th>PAYMENT ID</th>
            <th>CONTRACT ID</th>
            <th>AMOUNT</th>
            <th>PAID ON</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be added dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Form Section -->
    <div id="formSection" class="card p-4 bg-light d-none mt-4 position-relative">
      <!-- Cancel Button -->
      <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>

      <h5 id="formTitle">Insert Payment</h5>
      <form id="userForm" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="contract_id" class="form-control" placeholder="Contract ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="number" step="0.01" min="0" id="amount" class="form-control" placeholder="Amount" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Link your external JS -->
  <script src="JS/payments.js"></script>
</body>
</html>
