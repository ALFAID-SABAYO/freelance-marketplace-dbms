
<!doctype html>
<html lang="en">
<head>
  <title>Projects Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">

    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
      <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
      <button class="btn btn-info" onclick="showChart()">📊 Show Chart</button>
      </div>
    </div>
    <h2 class="mb-3">Project</h2>
  
    <div id="tableSection" class="table-responsive shadow-sm rounded">
        <table class="table table-light table-bordered" id="projectsTable">
            <thead class="table-secondary">
                <tr class="text-center">
                    <th>PROJECT ID</th>
                    <th>CLIENT ID</th>
                    <th>TITLE</th>
                    <th>DESCRIPTION</th>
                    <th>CATEGORY ID</th>
                    <th>BUDGET</th>
                    <th>POSTED AT</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

  <div id="formSection" class="card p-4 bg-light d-none mt-4">
 
  <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>

  <h5 id="formTitle">Insert Project</h5>
  <form id="userForm" novalidate>
    <div class="row">
  
      <div class="col-md-4 mb-3">
        <input type="text" id="client_id" class="form-control" placeholder="Client ID" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="text" id="title" class="form-control" placeholder="Title" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="text" id="description" class="form-control" placeholder="Description" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="text" id="category_id" class="form-control" placeholder="Category ID" required />
      </div>
      <div class="col-md-4 mb-3">
        <input type="number" step="0.01" min="0" id="budget" class="form-control" placeholder="Budget" required />
      </div>
    </div>
    <button type="submit" class="btn btn-primary">💾 Submit</button>
  </form>
</div>

 <div id="chartSection" class="card p-4 bg-white d-none">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5>Projects Budget Chart</h5>
    <button class="btn btn-light" onclick="hideChart()">✖ </button>
  </div>
  <canvas id="skillChart" width="400" height="400"></canvas>
</div>
</div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

<script src="JS/projects.js"></script>
</body>
</html>
