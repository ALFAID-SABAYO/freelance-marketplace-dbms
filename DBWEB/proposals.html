<!doctype html>
<html lang="en">
<head>
  <title>Projects Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <!-- Your external CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
      <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
        <!-- <button class="btn btn-warning" onclick="showForm('upgrade')">🛠️ Upgrade</button> -->
      </div>
    </div>
<body>
    <div class="table-responsive">
        <table class="table table-danger table-bordered" id="proposalsTable">
            <thead>
                <tr>
                    <th>PROPOSAL ID</th>
                    <th>PROJECT ID</th>
                    <th>FREELANCER ID</th>
                    <th>BID AMOUNT</th>
                    <th>MESSAGE</th>
                    <th>SUBMITTED AT</th>
                </tr>
            </thead>
            <tbody>
                <!-- Proposals rows here -->
            </tbody>
        </table>
    </div>

     <!-- Form Section -->
    <div id="formSection" class="card p-4 bg-light d-none mt-4">
      <h5 id="formTitle">Insert User</h5>
      <form id="userForm" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="Proposals" class="form-control" placeholder="Proposal ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="project_id" class="form-control" placeholder="Project ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="freelance_id" class="form-control" placeholder="Freelancer ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="bid_amount" class="form-control" placeholder="Bid Amount" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="message" class="form-control" placeholder="Message" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>
  </div>
 
  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Link to external JS file -->
    <script src="JS/proposals.js"></script>
</body>
</html>
