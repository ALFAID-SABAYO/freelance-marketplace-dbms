<!doctype html>
<html lang="en">
<head>
  <title>Proposals Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
</head>
<body>
  <div class="container my-4">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
        <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
      </div>
    </div>
<h2 class="mb-3">Proposal</h2>
    <div id="tableSection" class="table-responsive">
        <table class="table table-light table-bordered" id="proposalsTable">
           <thead class="table-secondary">
                <tr>
                    <th>PROPOSAL ID</th>
                    <th>PROJECT ID</th>
                    <th>FREELANCER ID</th>
                    <th>BID AMOUNT</th>
                    <th>MESSAGE</th>
                    <th>SUBMITTED AT</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="formSection" class="card p-4 bg-light d-none mt-4 position-relative">
      <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>
      <h5 id="formTitle">Insert Proposal</h5>
      <form id="userForm" novalidate>
        <div class="row">
          <!-- <div class="col-md-4 mb-3">
            <input type="text" id="proposal_id" class="form-control" placeholder="Proposal ID" required />
          </div> -->
          <div class="col-md-4 mb-3">
            <input type="text" id="project_id" class="form-control" placeholder="Project ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="freelancer_id" class="form-control" placeholder="Freelancer ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="number" step="0.01" min="0" id="bid_amount" class="form-control" placeholder="Bid Amount" required />
          </div>
          <div class="col-md-8 mb-3">
            <input type="text" id="message" class="form-control" placeholder="Message" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>
</div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <script src="JS/proposals.js"></script>
</body>
</html>
