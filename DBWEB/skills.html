<!doctype html>
<html lang="en">
<head>
  <title>Skills Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container">

    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
        <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
      </div>
    </div>

    <h2 class="mb-3">Skill</h2>
    <div class="table-responsive">
        <table class="table table-light table-bordered" id="skillsTable">
           <thead class="table-secondary">
                <tr class="text-center">
                    <th>SKILL ID</th>
                    <th>SKILL NAME</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
  
    <div id="formSection" class="card p-4 bg-light">
       <button type="button" id="cancelFormBtn" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"></button>
      <h5 id="formTitle">Insert Skill</h5>
      <form id="skillForm" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="name" class="form-control" placeholder="Skill Name" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>
  </div>
 
    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        crossorigin="anonymous"
    ></script>
    <script src="JS/skills.js"></script>
</body>
</html>
