
<!doctype html>
<html lang="en">
<head>
  <title>Users Table</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  
  <!-- Your external CSS -->
  <link rel="stylesheet" href="CSS/STYLE.CSS" />
</head>
<body>
  <div class="container">

    <!-- Top Buttons -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 Home</button>
      <div>
      <button class="btn btn-success me-2" onclick="showForm('insert')">➕ Insert</button>
        <!-- <button class="btn btn-warning" onclick="showForm('upgrade')">🛠️ Upgrade</button> -->
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive shadow-sm rounded">
      <table class="table table-bordered mb-0" id="usersTable" >
        <thead class="table-secondary">
          <tr class="text-center">
            <th>USER ID</th>
            <th>USERNAME</th>
            <th>EMAIL</th>
            <th>PASSWORD</th>
            <th>FULL NAME</th>
            <th>USER TYPE</th>
            <th>CREATED AT</th>
            <th>EDIT</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

    <!-- Form Section -->
    <div id="formSection" class="card p-4 bg-light d-none mt-4">
      <h5 id="formTitle">Insert User</h5>
      <form id="userForm" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <input type="text" id="user_id" class="form-control" placeholder="User ID" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="email" id="email" class="form-control" placeholder="Email" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="full_name" class="form-control" placeholder="Full Name" required />
          </div>
          <div class="col-md-4 mb-3">
            <input type="text" id="user_type" class="form-control" placeholder="User Type" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 Submit</button>
      </form>
    </div>
  </div>
 
  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Link to external JS file -->
  <script src="JS/users.js"></script>

</body>
</html>
